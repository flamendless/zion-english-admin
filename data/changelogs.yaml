  - version: "2026.08.17"
    date: "2026-08-17"
    released: true
    breaking_changes: []
    new_features:
      - text: "Superusers can create and manage system announcements that appear as persistent banners on the dashboard and all pages."
      - text: "Announcements support info, warning, and critical levels, a schedule, and visibility for all teachers or selected teachers only."
      - text: "Teachers can complete missing first, middle, or last name on their profile when those fields were not set at registration."
      - text: "You can browse release notes on the Changelogs page from the dashboard."
        commit: "b1aa64a"
      - text: "You can record and edit classes with start and end times instead of entering duration only."
        commit: "b1aa64a"
      - text: "Superusers can view teacher profile details in a quick-view modal from the teachers list."
        commit: "b1aa64a"
    improvements:
      - text: "Student registration and edit forms use an improved teacher assignment picker with add/remove rows."
      - text: "A live digital clock appears on the dashboard and page headers."
        commit: "b1aa64a"
    bug_fixes:
      - text: "Fixed an issue where creating an announcement did not redirect back to the announcements list."
      - text: "Fixed Edit and Delete actions on the announcements list so they use consistent bordered button styling."
      - text: "Fixed an issue where superusers could not save teacher edits when password fields were left empty on the edit form."
    removed: []
    security: []
    deprecated: []
    internal:
      - text: "Consolidated shared validation helpers for currencies, passwords, Google Sheet URLs, and dates across admin handlers."
        commit: "9a147b0"

